name: ci

on:
  push:
  pull_request:

jobs:
  # Primary runtime: full pipeline (test + typecheck + lint + build).
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run test:typecheck
      - run: bun run lint
      # Docs gate: links and heading anchors resolve, and release versions
      # stay in CHANGELOG.md instead of spreading through the docs.
      - name: docs check
        run: node scripts/check-docs.mjs
      - run: bun run build
      # The bundle targets node; prove it loads outside Bun.
      - run: node -e "import('./dist/index.js').then((m) => { if (typeof m.VERSION !== 'string' || m.VERSION.length === 0) process.exit(1); console.log('dist VERSION:', m.VERSION); })"
      # Cross-runtime equivalence: fixed fixtures produce byte-identical
      # PNG / .mcpx / canonical JSON from the Bun source CLI and the Node
      # bundle. Any difference fails this step (and the job).
      - name: runtime equivalence (Bun source vs Node bundle)
        run: node scripts/compare-runtime.mjs
      # §101.1 dependency gate: sharp / libvips / Skia must not appear.
      - name: dependency gate (§101.1)
        run: |
          if grep -rEi 'sharp|libvips|skia' package.json bun.lock; then
            echo 'FORBIDDEN dependency (sharp/libvips/Skia) detected' >&2
            exit 1
          fi
          echo 'dependency gate passed'
      # §100.2 / §100.3: no Math.random, no transcendental float funcs in src.
      - name: determinism guard (§100.2, §100.3)
        run: |
          if grep -rEn 'Math\.random' src tests; then
            echo 'Math.random is forbidden' >&2
            exit 1
          fi
          if grep -rEn 'Math\.(cbrt|pow|exp|sin|cos|tan|asin|acos|atan|atan2|log|sqrt|sinh|cosh|tanh)' src; then
            echo 'transcendental Math function in src/ is forbidden' >&2
            exit 1
          fi
          echo 'determinism guard passed'
      # src must stay portable: no Bun-only APIs (§100.5).
      - name: portability guard (§100.5)
        run: |
          if grep -rEn 'Bun\.|Bun\.file|Bun\.serve|from ["'"'"']bun' src; then
            echo 'Bun-only API in src/ breaks Node portability' >&2
            exit 1
          fi
          echo 'portability guard passed'

  # Portable runtime: same static checks under Node, no Bun required.
  # bun:test needs the Bun runner, so the Node job covers typecheck,
  # lint, dependency gates, determinism guards, plus the node:test entries
  # that run the same shared assertions as the Bun entries (§100.5).
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Bun is a build tool here only: it bundles, Node executes everything.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx @biomejs/biome check .
      # §100.5 / §100.4: every shared dual entry runs outside Bun.
      # find-form so new .node.ts entries join automatically; no globstar.
      - run: |
          for entry in $(find tests -name '*.node.ts' | sort); do
            node --test "$entry" || exit 1
          done
      # Bundle under Node (Bun acts only as the bundler inside
      # scripts/build.mjs), then prove Bun source CLI and Node bundle agree.
      - run: node scripts/build.mjs
      - name: runtime equivalence (Bun source vs Node bundle)
        run: node scripts/compare-runtime.mjs
      - name: dependency gate (§101.1)
        run: |
          if grep -rEi 'sharp|libvips|skia' package.json package-lock.json 2>/dev/null; then
            echo 'FORBIDDEN dependency (sharp/libvips/Skia) detected' >&2
            exit 1
          fi
          echo 'dependency gate passed'
      - name: determinism guard (§100.2, §100.3)
        run: |
          if grep -rEn 'Math\.random' src tests; then
            echo 'Math.random is forbidden' >&2
            exit 1
          fi
          if grep -rEn 'Math\.(cbrt|pow|exp|sin|cos|tan|asin|acos|atan|atan2|log|sqrt|sinh|cosh|tanh)' src; then
            echo 'transcendental Math function in src/ is forbidden' >&2
            exit 1
          fi
          echo 'determinism guard passed'

  # macOS smoke: install from a clean checkout, build, and run the
  # render → analyze → validate main chain on fixed fixtures.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: release smoke (render, analyze, validate)
        run: |
          smoke="$RUNNER_TEMP/mc-asset-smoke"
          mkdir -p "$smoke"
          node dist/mc-asset.js render tests/cli/fixtures/tiny.grid --output "$smoke/tiny.png"
          node dist/mc-asset.js analyze "$smoke/tiny.png"
          node dist/mc-asset.js validate "$smoke/tiny.png"
